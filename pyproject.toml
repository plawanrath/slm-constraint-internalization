[project]
name = "sci"
version = "0.1.0"
description = "Schema-derived constraint internalization for small language models."
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["sci*"]

[tool.setuptools.package-data]
"sci.constraints" = ["grammars/*.lark", "lattices/*.json"]
"sci.synth" = ["grammars/*.lark"]
"sci.transfer.llvmir" = ["grammars/*.lark"]
"sci.transfer.scf" = ["grammars/*.lark", "lattices/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests that take >5s",
    "docker: tests requiring the LLVM docker container",
    "mlx: tests requiring MLX + Apple Silicon",
    "ollama: tests requiring a running Ollama daemon",
]

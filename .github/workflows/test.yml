name: test
on: [push, pull_request]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r scripts/env/requirements.ci.txt && pip install -e .
      - run: python -m pytest -q -m "not slow and not docker and not mlx and not ollama"
